
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BR Despachante | Consulta Veicular</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #172033;
    }
    header {
      background: #123b73;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 25px; }
    header p { margin-bottom: 0; }
    main {
      max-width: 520px;
      margin: 25px auto;
      padding: 0 14px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 15px;
      box-shadow: 0 5px 20px #00000010;
    }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border-radius: 9px;
    }
    input { border: 1px solid #bbc6d5; }
    button {
      margin-top: 14px;
      border: 0;
      background: #123b73;
      color: white;
      font-weight: bold;
    }
    .aviso {
      padding: 12px;
      border-radius: 8px;
      background: #fff4d6;
      color: #72551a;
      line-height: 1.5;
      font-size: 14px;
    }
    #resultado { margin-top: 16px; line-height: 1.5; }
    footer {
      text-align: center;
      padding: 20px;
      color: #657186;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🇧🇷 BR DESPACHANTE</h1>
    <p>Consulta veicular online</p>
  </header>

  <main>
    <section class="card">
      <h2>Consulte pela placa</h2>
      <p>Informe a placa do veículo para continuar.</p>

      <div class="aviso">
        Site em fase de configuração. Consultas reais e pagamentos ainda não estão disponíveis. Não efetue pagamentos nesta página.
      </div>

      <form id="consulta">
        <label for="placa">Placa do veículo</label>
        <input
          id="placa"
          name="placa"
          placeholder="ABC1D23"
          maxlength="7"
          required
        >
        <button type="submit">Consultar placa</button>
      </form>

      <div id="resultado" role="status"></div>
    </section>
  </main>

  <footer>
    BR Despachante · Consulta veicular online
  </footer>

  <script>
    document.getElementById("consulta").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("resultado").textContent =
        "A integração com o servidor ainda será configurada. Nenhuma consulta foi realizada.";
    });
  </script>
</body>
</html>
